app-id: org.nongnu.lingot
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk

command: lingot
finish-args:
  # X11
  - --share=ipc
  - --socket=fallback-x11
  #Wayland
  - --socket=wayland
  - --device=dri
  # Audio
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
modules:
  - shared-modules/intltool/intltool-0.51.json
  - name: json-c
    buildsystem: "cmake-ninja"
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/json-c/json-c.git
        tag: json-c-0.18-20240915
        commit: 41a55cfcedb54d9c1874f2f0eb07b504091d7e37
        x-checker-data:
          type: git
          tag-pattern: ^json-c-([0-9.]+)-[0-9]+$
  - name: lingot
    post-install:
      - desktop-file-edit --set-icon=$FLATPAK_ID /app/share/applications/org.nongnu.lingot.desktop
    sources:
      - type: git
        url: https://github.com/ibancg/lingot.git
        tag: v1.1.1
        commit: 08145337c19d51a8d2463e8ec6a922757a1fd143
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
      - type: patch
        path: patches/0001-Add-Developer-content-rating-releases-tags.patch
